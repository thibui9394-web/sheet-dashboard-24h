name: Update Dashboard Snapshot

on:
  workflow_dispatch:
    inputs:
      scan_all:
        description: "Quét toàn bộ lịch sử (mặc định và khuyến nghị)"
        type: boolean
        required: false
        default: true
      scan_jan:
        description: "Quét Tháng 01/2026"
        type: boolean
        required: false
        default: false
      scan_feb:
        description: "Quét Tháng 02/2026"
        type: boolean
        required: false
        default: false
      scan_mar:
        description: "Quét Tháng 03/2026"
        type: boolean
        required: false
        default: false
      scan_apr:
        description: "Quét Tháng 04/2026"
        type: boolean
        required: false
        default: false
      scan_may:
        description: "Quét Tháng 05/2026"
        type: boolean
        required: false
        default: false
      scan_jun:
        description: "Quét Tháng 06/2026"
        type: boolean
        required: false
        default: false
      scan_jul:
        description: "Quét Tháng 07/2026"
        type: boolean
        required: false
        default: false
      scan_aug:
        description: "Quét Tháng 08/2026"
        type: boolean
        required: false
        default: false
      scan_sep:
        description: "Quét Tháng 09/2026"
        type: boolean
        required: false
        default: false
      scan_oct:
        description: "Quét Tháng 10/2026"
        type: boolean
        required: false
        default: false
      scan_nov:
        description: "Quét Tháng 11/2026"
        type: boolean
        required: false
        default: false
      scan_dec:
        description: "Quét Tháng 12/2026"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

# Chỉ cho một lần cập nhật snapshot chạy tại một thời điểm để hai lần dispatch
# gần nhau không cùng checkout một commit rồi tranh nhau git push.
concurrency:
  group: update-dashboard-snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Parse Scan Scope
        run: |
          FORCE_FULL=false
          MONTHS=()
          
          if [ "${{ github.event.inputs.scan_all }}" = "true" ]; then
            FORCE_FULL=true
          fi
          if [ "${{ github.event.inputs.scan_jan }}" = "true" ]; then MONTHS+=("2026-01"); fi
          if [ "${{ github.event.inputs.scan_feb }}" = "true" ]; then MONTHS+=("2026-02"); fi
          if [ "${{ github.event.inputs.scan_mar }}" = "true" ]; then MONTHS+=("2026-03"); fi
          if [ "${{ github.event.inputs.scan_apr }}" = "true" ]; then MONTHS+=("2026-04"); fi
          if [ "${{ github.event.inputs.scan_may }}" = "true" ]; then MONTHS+=("2026-05"); fi
          if [ "${{ github.event.inputs.scan_jun }}" = "true" ]; then MONTHS+=("2026-06"); fi
          if [ "${{ github.event.inputs.scan_jul }}" = "true" ]; then MONTHS+=("2026-07"); fi
          if [ "${{ github.event.inputs.scan_aug }}" = "true" ]; then MONTHS+=("2026-08"); fi
          if [ "${{ github.event.inputs.scan_sep }}" = "true" ]; then MONTHS+=("2026-09"); fi
          if [ "${{ github.event.inputs.scan_oct }}" = "true" ]; then MONTHS+=("2026-10"); fi
          if [ "${{ github.event.inputs.scan_nov }}" = "true" ]; then MONTHS+=("2026-11"); fi
          if [ "${{ github.event.inputs.scan_dec }}" = "true" ]; then MONTHS+=("2026-12"); fi

          # Full scan thắng mọi lựa chọn tháng. Nếu dispatch không truyền input
          # (client cũ/API thủ công), vẫn mặc định full scan để việc chèn, xóa,
          # dời hoặc sửa dòng ở tháng cũ không bị giữ cache sai.
          if [ "${{ github.event.inputs.scan_all }}" = "true" ] || [ ${#MONTHS[@]} -eq 0 ]; then
            FORCE_FULL=true
            MONTHS=()
          fi
          
          IFS=',' eval 'MONTHS_STR="${MONTHS[*]}"'
          
          echo "FORCE_FULL_SNAPSHOT=$FORCE_FULL" >> $GITHUB_ENV
          echo "TARGET_MONTHS=$MONTHS_STR" >> $GITHUB_ENV
        shell: bash

      - name: Build Snapshot
        run: |
          if [ "$FORCE_FULL_SNAPSHOT" = "true" ]; then
            echo "Running full snapshot update..."
            FORCE_FULL_SNAPSHOT=true node ./scripts/update-snapshot.mjs
          elif [ -n "$TARGET_MONTHS" ]; then
            IFS=',' read -ra ADDR <<< "$TARGET_MONTHS"
            for m in "${ADDR[@]}"; do
              echo "Running snapshot update for target month: $m..."
              TARGET_MONTH="$m" node ./scripts/update-snapshot.mjs
            done
          else
            echo "Running active-month snapshot update..."
            node ./scripts/update-snapshot.mjs
          fi
        env:
          TZ: Asia/Ho_Chi_Minh
          SHEET_ID: 1QQ-FGthecJ9bl-XlwDU17ZiD8b47ilJuUs1bSkgpYvM
          SHEET_GID: 131891982
          SHEET_NAME: 2026_Design_Team
          SHEET_MAX_COLUMN: AA
          EDIT_LOG_API_URL: ${{ secrets.EDIT_LOG_API_URL }}
          EDIT_LOG_API_TOKEN: ${{ secrets.EDIT_LOG_API_TOKEN }}

      - name: Commit Snapshot
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add data/snapshot.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update dashboard snapshot"
            git push
          fi
