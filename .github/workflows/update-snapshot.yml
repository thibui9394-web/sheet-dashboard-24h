name: Update Dashboard Snapshot

on:
  workflow_dispatch:
    inputs:
      scan_scope:
        description: "Chọn phạm vi quét dữ liệu"
        type: choice
        required: true
        default: "Toàn bộ lịch sử (Quét tất cả)"
        options:
          - "Toàn bộ lịch sử (Quét tất cả)"
          - "Chỉ quét Tháng 07/2026"
          - "Chỉ quét Tháng 06/2026"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Parse Scan Scope
        run: |
          if [ "${{ github.event.inputs.scan_scope }}" = "Chỉ quét Tháng 07/2026" ]; then
            echo "FORCE_FULL_SNAPSHOT=false" >> $GITHUB_ENV
            echo "TARGET_MONTH=2026-07" >> $GITHUB_ENV
          elif [ "${{ github.event.inputs.scan_scope }}" = "Chỉ quét Tháng 06/2026" ]; then
            echo "FORCE_FULL_SNAPSHOT=false" >> $GITHUB_ENV
            echo "TARGET_MONTH=2026-06" >> $GITHUB_ENV
          else
            echo "FORCE_FULL_SNAPSHOT=true" >> $GITHUB_ENV
            echo "TARGET_MONTH=" >> $GITHUB_ENV
          fi
        shell: bash

      - name: Build Snapshot
        run: node ./scripts/update-snapshot.mjs
        env:
          TZ: Asia/Ho_Chi_Minh
          SHEET_ID: 1QQ-FGthecJ9bl-XlwDU17ZiD8b47ilJuUs1bSkgpYvM
          SHEET_GID: 131891982
          SHEET_NAME: 2026_Design_Team

      - name: Commit Snapshot
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add data/snapshot.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update dashboard snapshot"
            git push
          fi
