name: Update Dashboard Snapshot

on:
  workflow_dispatch:
    inputs:
      force_full:
        description: "Qu\u00e9t l\u1ea1i to\u00e0n b\u1ed9 l\u1ecbch s\u1eed (bao g\u1ed3m c\u1ea3 c\u00e1c th\u00e1ng c\u0169 nh\u01b0 th\u00e1ng 6)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Snapshot
        run: node ./scripts/update-snapshot.mjs
        env:
          TZ: Asia/Ho_Chi_Minh
          SHEET_ID: 1QQ-FGthecJ9bl-XlwDU17ZiD8b47ilJuUs1bSkgpYvM
          SHEET_GID: 131891982
          SHEET_NAME: 2026_Design_Team
          FORCE_FULL_SNAPSHOT: ${{ github.event.inputs.force_full || 'true' }}

      - name: Commit Snapshot
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add data/snapshot.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update dashboard snapshot"
            git push
          fi
